<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>학교 출입 보안 시뮬레이션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: 화면을 세로선으로 반 나눔 — 왼쪽은 현장(지도 + 실내), 오른쪽은 AI 관제 소프트웨어 화면 */
:root{
  --bg:#eceff3; --surface:#ffffff; --ink:#151c24; --muted:#58646f; --line:#d3d9e0; --line-strong:#b9c2cc; --divider:#151c24; --chip:#eef1f5;
  --pen-blue:#2350d8; --pen-red:#d8352b; --ok:#13854f; --warn:#d42a24;
  --font-ui:'IBM Plex Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-hand:'Gaegu', 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  /* 현장 그림 */
  --s-ground:#f2f5ec; --s-dirt:#ecdcb8; --s-road:#e0e4e8; --s-build:#fbfaf7; --s-ink:#1d232a; --s-wall:#39414a; --s-out:#dadfe5; --s-tree:#a3cc86; --s-window:#bcd3ea;
  --r-wall:#f3efe7; --r-floor:#dccfb8; --r-line:#6b6257; --r-desk:#bf9467; --r-desk-d:#9c7550; --r-door:#b98a5c; --r-door-open:#3a2b1d;
  /* AI 소프트웨어 화면 (어두운 관제 화면으로 고정) */
  --c-bg:#0a111d; --c-panel:#101a2a; --c-deep:#0b1422; --c-line:#22324c; --c-ink:#dbe5f5; --c-dim:#8091ab; --c-ok:#35d27c; --c-warn:#ff4d48; --c-scan:#ffc940;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1217; --surface:#161b22; --ink:#e6ebf1; --muted:#9aa6b2; --line:#2a323c; --line-strong:#3a4450; --divider:#c9d2dc; --chip:#202833;
    --pen-blue:#7896ff; --pen-red:#ff6c61; --ok:#3ccf83; --warn:#ff5a52;
    --s-ground:#1b231f; --s-dirt:#3b3427; --s-road:#2c3238; --s-build:#272c33; --s-ink:#e4e9ee; --s-wall:#a3aeb9; --s-out:#22272d; --s-tree:#3f5d35; --s-window:#3c5069;
    --r-wall:#24282e; --r-floor:#352d25; --r-line:#a59a8c; --r-desk:#7a5a3d; --r-desk-d:#5e442d; --r-door:#6d5135; --r-door-open:#120d08;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1217; --surface:#161b22; --ink:#e6ebf1; --muted:#9aa6b2; --line:#2a323c; --line-strong:#3a4450; --divider:#c9d2dc; --chip:#202833;
  --pen-blue:#7896ff; --pen-red:#ff6c61; --ok:#3ccf83; --warn:#ff5a52;
  --s-ground:#1b231f; --s-dirt:#3b3427; --s-road:#2c3238; --s-build:#272c33; --s-ink:#e4e9ee; --s-wall:#a3aeb9; --s-out:#22272d; --s-tree:#3f5d35; --s-window:#3c5069;
  --r-wall:#24282e; --r-floor:#352d25; --r-line:#a59a8c; --r-desk:#7a5a3d; --r-desk-d:#5e442d; --r-door:#6d5135; --r-door-open:#120d08;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.5}
.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.field{padding-block:16px;padding-right:20px;border-right:2px solid var(--divider);display:flex;flex-direction:column;gap:10px;min-width:0}
.ai{padding-block:16px;padding-left:20px;min-width:0;display:flex}
@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .field{padding-right:0;border-right:0;border-bottom:2px solid var(--divider);padding-bottom:20px}
  .ai{padding-left:0;padding-top:20px}
}

/* 버튼 */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.runs{display:flex;gap:8px;flex-wrap:wrap}
.run{font:600 15px/1.2 var(--font-ui);padding:11px 16px;border-radius:10px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);
  cursor:pointer;display:inline-flex;gap:9px;align-items:center;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s,opacity .2s}
.run:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 0 var(--ink)}
.run:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.run .sw{width:12px;height:12px;border-radius:50%;flex:none}
.run-auth .sw{background:var(--ok)}
.run-out .sw{background:var(--warn)}
.run:disabled{opacity:.4;cursor:not-allowed}
.run.is-running{opacity:1;cursor:progress}
.run.is-running .sw{animation:pulse .8s ease-in-out infinite}
.pick-wrap{display:inline-flex;align-items:center;gap:8px}
.pick-label{font-size:12px;color:var(--muted);letter-spacing:.04em}
.seg{display:inline-flex;border:1.5px solid var(--line-strong);border-radius:9px;overflow:hidden;background:var(--surface)}
.pick{font:500 14px/1.2 var(--font-ui);padding:8px 14px;background:transparent;border:0;color:var(--muted);cursor:pointer}
.pick[aria-checked="true"]{background:var(--ink);color:var(--bg)}
.pick:disabled{cursor:not-allowed;opacity:.55}
.run:focus-visible,.pick:focus-visible{outline:3px solid var(--pen-blue);outline-offset:2px}

.caption{display:flex;gap:10px;align-items:center;min-height:42px;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.step-no{font:600 12px/1.4 var(--font-mono);padding:3px 8px;border-radius:6px;background:var(--chip);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
#stepText{font-weight:500;min-width:0}

/* 현장 그림 */
.scene{margin:0;border:1.5px solid var(--line-strong);border-radius:12px;overflow:hidden;background:var(--surface);transition:box-shadow .3s,border-color .3s}
.scene figcaption{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 12px;font-size:13px;font-weight:600;border-bottom:1px solid var(--line);flex-wrap:wrap}
.scene .chip{font-weight:500;font-size:12px;color:var(--muted);background:var(--chip);padding:2px 8px;border-radius:999px}
.scene svg{display:block;width:100%;height:auto}
.scene.alarm{border-color:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 28%,transparent)}
.scene.alarm .chip{color:#fff;background:var(--warn)}
.scene.spot{animation:spot 1.4s ease-out}
@keyframes spot{0%{transform:scale(.985);box-shadow:0 0 0 0 color-mix(in srgb,var(--pen-blue) 50%,transparent)}40%{transform:scale(1.01)}100%{transform:scale(1);box-shadow:0 0 0 10px transparent}}

svg .hand{font-family:var(--font-hand);fill:var(--s-ink);font-weight:700}
svg .lbl{font-size:19px}
svg .lbl-s{font-size:13px}
svg .on-ground{stroke:var(--s-ground);stroke-width:4px;paint-order:stroke}
svg .room-lbl{font-family:var(--font-hand);font-weight:700;font-size:13px;fill:var(--r-line)}
svg .tag{font:600 9.5px var(--font-ui);fill:var(--s-ink);stroke:var(--s-ground);stroke-width:3px;paint-order:stroke;text-anchor:middle}
svg .bubble rect,svg .bubble path{fill:#ffffff;stroke:#1d232a;stroke-width:1.3}
svg .bubble text{font:500 12px var(--font-ui);fill:#1d232a}
svg .cone{transition:opacity .35s}
svg .cone.scan{fill:rgba(255,196,40,.30)}
svg .cone.ok{fill:rgba(30,175,100,.26)}
svg .cone.bad{fill:rgba(225,40,40,.28)}
svg .mon-txt{font-family:var(--font-ui);font-weight:700;fill:#fff}
.arm-write{animation:write .55s ease-in-out infinite alternate}
.arm-type{animation:type .16s steps(2) infinite}
.paused{animation-play-state:paused!important}
@keyframes write{from{transform:translateX(-2px)}to{transform:translate(3px,-1px)}}
@keyframes type{from{transform:translateY(0)}to{transform:translateY(-2px)}}
.blink{animation:blink .7s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
@keyframes pulse{50%{transform:scale(.6);opacity:.6}}

/* AI 소프트웨어 화면 */
.console{flex:1;display:flex;flex-direction:column;gap:10px;background:var(--c-bg);color:var(--c-ink);border-radius:14px;padding:14px;
  border:1.5px solid var(--c-line);transition:border-color .3s,box-shadow .3s;min-width:0}
.console.is-warn{border-color:var(--c-warn);box-shadow:0 0 0 3px rgba(255,77,72,.25),inset 0 0 50px rgba(255,77,72,.12)}
.c-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.c-brand{display:flex;flex-direction:column;gap:1px;min-width:0}
.c-brand b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.c-brand span{font:400 11px/1.4 var(--font-mono);color:var(--c-dim);font-variant-numeric:tabular-nums}
.status{display:inline-flex;gap:8px;align-items:center;padding:7px 16px 7px 12px;border-radius:999px;font-weight:700;font-size:17px;border:1.5px solid}
.status svg{width:20px;height:20px}
.status small{font-size:11px;font-weight:500;opacity:.85}
.status[data-s="safe"]{color:var(--c-ok);border-color:currentColor;background:rgba(53,210,124,.1)}
.status[data-s="warn"]{color:#fff;background:var(--c-warn);border-color:var(--c-warn);animation:wpulse 1s ease-in-out infinite}
@keyframes wpulse{50%{box-shadow:0 0 0 7px rgba(255,77,72,.25)}}
.c-alert{background:var(--c-warn);color:#fff;font-weight:600;padding:8px 12px;border-radius:8px;display:flex;gap:8px;align-items:center;font-size:13px}
.c-alert svg{width:18px;height:18px;flex:none}
.c-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:10px}
@media (max-width:520px){.c-row{grid-template-columns:minmax(0,1fr)}}
.c-box{background:var(--c-panel);border:1px solid var(--c-line);border-radius:10px;padding:10px 12px;min-width:0}
.c-label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;letter-spacing:.03em;color:var(--c-dim);margin-bottom:8px;font-weight:600;flex-wrap:wrap}
.c-label em{font-style:normal;font-weight:500;font-size:11px}
.rec{color:var(--c-warn)}

.cam-view{position:relative;aspect-ratio:4/3;max-height:190px;width:100%;border-radius:6px;overflow:hidden;display:grid;place-items:center;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 4px),radial-gradient(circle at 50% 40%,#13223a,#060b14 75%)}
.cam-idle{color:var(--c-dim);font-size:12px;text-align:center;line-height:1.5}
.cam-idle small{font-size:11px;opacity:.8}
.cam-face{width:52%;max-width:120px}
.cam-face svg{display:block;width:100%;height:auto}
.cam-face.shred{animation:shred 1s ease-in forwards}
@keyframes shred{to{filter:blur(10px);opacity:0;transform:scale(1.12)}}
.bracket{--bc:var(--c-scan);position:absolute;left:21%;right:21%;top:6%;bottom:18%;
  background:
   linear-gradient(var(--bc),var(--bc)) left top/16px 2px no-repeat,linear-gradient(var(--bc),var(--bc)) left top/2px 16px no-repeat,
   linear-gradient(var(--bc),var(--bc)) right top/16px 2px no-repeat,linear-gradient(var(--bc),var(--bc)) right top/2px 16px no-repeat,
   linear-gradient(var(--bc),var(--bc)) left bottom/16px 2px no-repeat,linear-gradient(var(--bc),var(--bc)) left bottom/2px 16px no-repeat,
   linear-gradient(var(--bc),var(--bc)) right bottom/16px 2px no-repeat,linear-gradient(var(--bc),var(--bc)) right bottom/2px 16px no-repeat}
.bracket[data-s="ok"]{--bc:var(--c-ok)} .bracket[data-s="bad"]{--bc:var(--c-warn)} .bracket[data-s="gone"]{--bc:var(--c-dim)}
.cam-tag{position:absolute;left:8px;bottom:8px;right:8px;text-align:center;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:5px;background:rgba(0,0,0,.6);color:var(--c-scan)}
.cam-tag[data-s="ok"]{color:var(--c-ok)} .cam-tag[data-s="bad"]{color:#fff;background:var(--c-warn)} .cam-tag[data-s="gone"]{color:var(--c-dim)}

.pipe ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;counter-reset:p}
.pipe li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:8px;font-size:13px;color:var(--c-dim)}
.pipe li::before{counter-increment:p;content:counter(p);width:22px;height:22px;border-radius:50%;border:1.5px solid var(--c-line);display:grid;place-items:center;font:600 11px var(--font-mono)}
.pipe li b{font-weight:600}
.pipe .p-val{font-size:12px;text-align:right}
.pipe li[data-state="active"]{color:var(--c-ink)}
.pipe li[data-state="active"]::before{border-color:var(--c-scan);color:var(--c-scan);box-shadow:0 0 0 3px rgba(255,201,64,.18)}
.pipe li[data-state="active"] .p-val{color:var(--c-scan)}
.pipe li[data-state="done"]{color:var(--c-ink)}
.pipe li[data-state="done"]::before{content:'✓';background:var(--c-ok);border-color:var(--c-ok);color:#06210f}
.pipe li[data-state="done"] .p-val{color:var(--c-ok)}
.pipe li[data-state="bad"]{color:var(--c-ink)}
.pipe li[data-state="bad"]::before{content:'!';background:var(--c-warn);border-color:var(--c-warn);color:#fff}
.pipe li[data-state="bad"] .p-val{color:#ff8b87}

.db{container-type:inline-size}
.faces{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
@container (max-width:520px){.faces{grid-template-columns:repeat(4,minmax(0,1fr))}}
.fcard{background:var(--c-deep);border:1.5px solid var(--c-line);border-radius:8px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:border-color .15s,background .2s,opacity .2s}
.fcard svg{width:100%;max-width:54px;height:auto;display:block}
.fname{font-size:11px;color:var(--c-ink);white-space:nowrap}
.fbar{width:100%;height:4px;background:#1b2840;border-radius:2px;overflow:hidden}
.fbar i{display:block;height:100%;width:0;background:var(--c-dim)}
.fpct{font:600 11px var(--font-mono);color:var(--c-dim);font-variant-numeric:tabular-nums}
.fcard.scan{border-color:var(--c-scan);box-shadow:0 0 0 2px rgba(255,201,64,.22)}
.fcard.scan .fbar i{background:var(--c-scan)}
.fcard.match{border-color:var(--c-ok);background:rgba(53,210,124,.12)}
.fcard.match .fbar i{background:var(--c-ok)}
.fcard.match .fpct{color:var(--c-ok)}
.fcard.miss{opacity:.55}
.verdict{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--c-deep);font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:4px 10px;flex-wrap:wrap;border:1px solid var(--c-line);color:var(--c-dim)}
.verdict small{font-weight:500;font-size:12px}
.verdict[data-v="ok"]{color:var(--c-ok);border-color:rgba(53,210,124,.5)}
.verdict[data-v="bad"]{color:#fff;background:rgba(255,77,72,.18);border-color:var(--c-warn)}

.data-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ditem{border:1px dashed var(--c-line);border-radius:8px;padding:7px 9px;display:flex;flex-direction:column;gap:1px;transition:background .25s,border-color .25s}
.ditem b{font-size:12px;color:var(--c-dim);font-weight:600}
.ditem span{font-size:13px;font-weight:600;color:var(--c-dim)}
.ditem[data-state="on"]{border-style:solid;border-color:var(--c-ok);background:rgba(53,210,124,.09)}
.ditem[data-state="on"] span{color:var(--c-ok)}

.log{flex:1;display:flex;flex-direction:column;min-height:120px}
.log ul{list-style:none;margin:0;padding:0;flex:1;max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:3px;font-size:12px}
.log li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
.log time{font-family:var(--font-mono);color:var(--c-dim);font-variant-numeric:tabular-nums}
.log li.warn{color:#ff8b87}
.log li.ok{color:var(--c-ok)}

@media (prefers-reduced-motion:reduce){
  .arm-write,.arm-type,.blink,.status[data-s="warn"],.scene.spot,.run.is-running .sw{animation:none}
}
</style>

</head>
<body>
<div class="app" id="app">
  <section class="field" aria-label="현장 화면">
    <div class="controls">
      <div class="runs">
        <button type="button" class="run run-auth" id="btnAuth"><span class="sw"></span>허가된 사람</button>
        <button type="button" class="run run-out" id="btnOut"><span class="sw"></span>허가 받지 않은 사람</button>
      </div>
      <div class="pick-wrap">
        <span class="pick-label">입구</span>
        <div class="seg" role="radiogroup" aria-label="입구 선택">
          <button type="button" class="pick" id="pickFront" role="radio" aria-checked="true">정문</button>
          <button type="button" class="pick" id="pickBack" role="radio" aria-checked="false">후문</button>
        </div>
      </div>
    </div>
    <div class="caption" aria-live="polite"><span class="step-no" id="stepNo">대기</span><span id="stepText">입구를 고른 뒤 인물 버튼을 누르면 끝까지 자동으로 실행됩니다.</span></div>

    <figure class="scene" id="outFig">
      <figcaption><span id="outTitle">정문 쪽</span><span class="chip" id="outChip">카메라: 정문 기둥</span></figcaption>
      <svg id="outdoor" viewBox="0 0 600 380" role="img" aria-label="학교 지도와 인물">
        <defs>
          <marker id="arrowHead" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 Z" fill="var(--s-ink)"/>
          </marker>
        </defs>

        <!-- 정문 쪽 지도 -->
        <g id="mapFront">
          <rect x="0" y="0" width="600" height="380" fill="var(--s-ground)"/>
          <rect x="550" y="0" width="50" height="380" fill="var(--s-out)"/>
          <g fill="var(--s-tree)">
            <circle cx="330" cy="40" r="16"/><circle cx="372" cy="62" r="13"/><circle cx="430" cy="36" r="15"/>
            <circle cx="498" cy="72" r="14"/><circle cx="470" cy="152" r="13"/><circle cx="518" cy="206" r="11"/>
            <circle cx="365" cy="335" r="15"/><circle cx="318" cy="362" r="11"/>
          </g>
          <!-- 운동장 -->
          <rect x="18" y="202" width="250" height="164" rx="10" fill="var(--s-dirt)" stroke="var(--s-ink)" stroke-width="1.5"/>
          <rect x="42" y="222" width="202" height="124" rx="62" fill="none" stroke="#ffffff" stroke-width="2" opacity=".85"/>
          <line x1="143" y1="222" x2="143" y2="346" stroke="#ffffff" stroke-width="1.5" opacity=".7"/>
          <text class="hand lbl on-ground" x="143" y="290" text-anchor="middle" style="stroke:var(--s-dirt)">운동장</text>
          <!-- 스탠드 -->
          <rect x="28" y="140" width="96" height="44" rx="4" fill="var(--s-ground)" stroke="var(--pen-red)" stroke-width="2"/>
          <path d="M36 152 H116 M36 162 H116 M36 172 H116" stroke="var(--pen-red)" stroke-width="1.2" opacity=".55"/>
          <text class="hand lbl on-ground" x="76" y="169" text-anchor="middle" style="fill:var(--pen-red)">스탠드</text>
          <!-- 길 -->
          <polyline points="600,290 430,290 300,180 170,140 150,124" fill="none" stroke="var(--pen-blue)" stroke-width="40" stroke-linejoin="round"/>
          <polyline points="600,290 430,290 300,180 170,140 150,124" fill="none" stroke="var(--s-road)" stroke-width="36" stroke-linejoin="round"/>
          <text class="hand lbl on-ground" x="326" y="166" text-anchor="middle">길</text>
          <!-- 본관 -->
          <rect x="40" y="16" width="220" height="106" rx="3" fill="var(--s-build)" stroke="var(--s-ink)" stroke-width="2"/>

  const f = now => { const t = dur <= 0 ? 1 : Math.min(1, (now - t0) / dur); fn(t); if (t < 1) requestAnimationFrame(f); else res(); };

});

  const cap = p.cap ? `<path d="M14 26 Q14 8 32 8 Q50 8 50 26Z" fill="${p.cap}" stroke="${K}" stroke-width="1"/><rect x="10" y="23.5" width="44" height="6" rx="3" fill="${p.cap}" stroke="${K}" stroke-width="1"/><circle cx="32" cy="9" r="1.6" fill="${K}"/>` : '';

/* ---------- 움직이는 대상 ---------- */
const actors = [];
class Actor {
  constructor(g, scale = 1, flip = false){ this.g = g; this.s = scale; this.flip = flip; this.x = 0; this.y = 0; this.dir = 1; this.walking = false; this.phase = 0; this.hide(); actors.push(this); }
  at(x, y){ this.x = x; this.y = y; this.render(); return this; }
  show(){ this.g.style.display = ''; this.visible = true; return this; }
  hide(){ this.g.style.display = 'none'; this.visible = false; this.walking = false; return this; }
  face(d){ this.dir = d; this.render(); }
  render(){
    const bob = this.walking ? -Math.abs(Math.sin(this.phase)) * 2.2 : 0;
    const sx = this.flip ? this.dir * this.s : this.s;
    this.g.setAttribute('transform', `translate(${this.x.toFixed(1)},${(this.y + bob).toFixed(1)}) scale(${sx},${this.s})`);
  }
  async walk(points, speed){
    this.walking = true;
    for (const [x, y] of points){
      const x0 = this.x, y0 = this.y, d = Math.hypot(x - x0, y - y0);
      if (Math.abs(x - x0) > 0.5) this.dir = x < x0 ? -1 : 1;
      await tween(d / speed * 1000, t => { this.x = x0 + (x - x0) * t; this.y = y0 + (y - y0) * t; });
    }
    this.walking = false; this.render();
  }
}
function mkActor(parent, html, scale, flip){
  const g = document.createElementNS(NS, 'g'); g.innerHTML = html; parent.appendChild(g);
  return new Actor(g, scale, flip);
}

/* ---------- 카메라 ---------- */
class Cam {
  constructor(rig, mx, my, idle){ this.rig = rig; this.cone = rig.querySelector('.cone'); this.led = rig.querySelector('.cam-led'); this.mx = mx; this.my = my; this.idle = idle; this.angle = idle; this.target = null; this.render(); }
  watch(a){ this.target = a; this.cone.style.opacity = 1; this.mode('scan'); }
  unwatch(){ this.target = null; this.cone.style.opacity = 0; }
  mode(m){ this.cone.setAttribute('class', 'cone ' + m); this.led.setAttribute('fill', m === 'bad' ? '#ff4d48' : m === 'scan' ? '#ffc940' : '#33d27b'); }
  reset(){ this.unwatch(); this.mode('scan'); this.led.setAttribute('fill', '#33d27b'); this.angle = this.idle; this.render(); }
  update(){
    let goal = this.idle;
    if (this.target){
      const tx = this.target.x, ty = this.target.y - 30;
      goal = Math.atan2(ty - this.my, tx - this.mx) * 180 / Math.PI;
      const L = Math.max(40, Math.hypot(tx - this.mx, ty - this.my) + 14), w = Math.max(14, L * 0.2);
      this.cone.setAttribute('points', `8,0 ${L.toFixed(0)},${(-w).toFixed(0)} ${L.toFixed(0)},${w.toFixed(0)}`);
    }
    const d = ((goal - this.angle + 540) % 360) - 180;
    this.angle += d * 0.14; this.render();
  }
  render(){ this.rig.setAttribute('transform', `translate(${this.mx},${this.my}) rotate(${this.angle.toFixed(1)})`); }
}

/* ---------- 말풍선 ---------- */
const bubbles = new Set();
async function say(actor, text, ms){
  const layer = $('bubbles');
  const g = document.createElementNS(NS, 'g'); g.setAttribute('class', 'bubble');
  g.innerHTML = `<path d="M-5 10 L0 18 L5 10 Z"/><rect rx="8" ry="8"/><text text-anchor="middle" y="4">${text}</text>`;
  layer.appendChild(g);
  const t = g.querySelector('text'), r = g.querySelector('rect'), tail = g.querySelector('path');
  const w = t.getComputedTextLength() + 20, h = 26;
  r.setAttribute('x', -w / 2); r.setAttribute('y', -h / 2); r.setAttribute('width', w); r.setAttribute('height', h);
  const b = { update(){
    const x = clamp(actor.x, w / 2 + 4, 596 - w / 2), y = actor.y - 58;
    g.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)})`);
    const tx = clamp(actor.x - x, -w / 2 + 10, w / 2 - 10);
    tail.setAttribute('d', `M${tx - 6} ${h / 2 - 1} L${tx} ${h / 2 + 8} L${tx + 6} ${h / 2 - 1} Z`);
  }};
  b.update(); bubbles.add(b);
  await sleep(ms);
  bubbles.delete(b); g.remove();
}
function clearBubbles(){ bubbles.clear(); $('bubbles').innerHTML = ''; }

function hairProfile(hx, hy, o){
  if (o.cap) return `<path d="M${hx-13} ${hy-3} Q${hx-12} ${hy-17} ${hx+1} ${hy-16} Q${hx+12} ${hy-15} ${hx+13} ${hy-6} Z" fill="${o.cap}"/><path d="M${hx+6} ${hy-7} L${hx+21} ${hy-4} L${hx+6} ${hy-3} Z" fill="#141a22"/><rect x="${hx-3}" y="${hy-14}" width="5" height="5" rx="1" fill="#e7c76a"/>`;
  let s = `<path d="M${hx-14} ${hy+5} Q${hx-15} ${hy-14} ${hx+1} ${hy-14} Q${hx+12} ${hy-13} ${hx+13} ${hy-4} Q${hx+3} ${hy-9} ${hx-4} ${hy-4} Q${hx-7} ${hy+2} ${hx-8} ${hy+9} Z" fill="${o.hc}"/>`;
  if (o.long) s = `<rect x="${hx-15}" y="${hy-6}" width="12" height="30" rx="6" fill="${o.hc}"/>` + s;
  if (o.bun) s += `<circle cx="${hx-12}" cy="${hy-11}" r="6" fill="${o.hc}"/>`;
  if (o.glasses) s += `<circle cx="${hx+7}" cy="${hy-1}" r="4" fill="none" stroke="#202833" stroke-width="1.4"/>`;
  return s;
}

/* 교무실 왼쪽 두 선생님의 개인 업무 화면 */
function workMonitorSVG(cx, w, h, kind){
  const x = cx - w / 2, y = 110 - h, sx = x + 4, sy = y + 4, sw = w - 8, sh = h - 8;
  const F = 'font-family="IBM Plex Sans KR, sans-serif"';
  let screen = '';
  if (kind === 0){
    /* 수행평가 채점표 */
    const rows = [['번호','과제','점수'],['1','제출','18'],['2','제출','20'],['3','미제출','—'],['4','제출','17']];
    const cw = [16, 38, 34], rh = 8, gy = sy + 12;
    rows.forEach((r, ri) => {
      let cx2 = sx + 2;
      r.forEach((c, ci) => {
        screen += `<rect x="${cx2}" y="${gy + ri * rh}" width="${cw[ci]}" height="${rh}" fill="${ri === 0 ? '#d7eedf' : '#ffffff'}" stroke="#c9d3cc" stroke-width=".5"/>`;
        screen += `<text x="${cx2 + cw[ci] / 2}" y="${gy + ri * rh + 5.8}" text-anchor="middle" font-size="5.6" fill="${ri === 0 ? '#1f5d3b' : (c === '미제출' ? '#c0392b' : '#2b333b')}" ${F}>${c}</text>`;
        cx2 += cw[ci];
      });
    });
    screen = `<rect x="${sx}" y="${sy}" width="${sw}" height="${sh}" rx="2" fill="#f4f7f5"/>
      <rect x="${sx}" y="${sy}" width="${sw}" height="9" rx="2" fill="#1f7a4d"/>
      <text x="${sx + 4}" y="${sy + 6.6}" font-size="6" fill="#fff" ${F}>2학년 수행평가 채점표</text>${screen}`;
  } else {
    /* 과학 수업 자료 만들기 */
    const thumbs = [0, 1, 2].map(i => `<rect x="${sx + 3}" y="${sy + 12 + i * 13}" width="16" height="10" fill="#fff" stroke="${i === 1 ? '#c4552a' : '#c9c9c9'}" stroke-width="${i === 1 ? 1 : .5}"/>`).join('');
    const mx = sx + 23, my = sy + 12;
    screen = `<rect x="${sx}" y="${sy}" width="${sw}" height="${sh}" rx="2" fill="#e9e9ec"/>
      <rect x="${sx}" y="${sy}" width="${sw}" height="9" rx="2" fill="#c4552a"/>
      <text x="${sx + 4}" y="${sy + 6.6}" font-size="6" fill="#fff" ${F}>과학 수업 자료 만들기</text>
      ${thumbs}
      <rect x="${mx}" y="${my}" width="66" height="40" fill="#fff" stroke="#c9c9c9" stroke-width=".5"/>
      <text x="${mx + 33}" y="${my + 8}" text-anchor="middle" font-size="6.4" font-weight="700" fill="#2b333b" ${F}>광합성의 원리</text>
      <circle cx="${mx + 10}" cy="${my + 21}" r="4.5" fill="#f5b82e"/>
      <path d="M${mx + 16} ${my + 22} L${mx + 26} ${my + 26}" stroke="#d08a1c" stroke-width="1"/>
      <path d="M${mx + 26} ${my + 26} l-3.2 -0.3 l1.4 -2.4 Z" fill="#d08a1c"/>
      <ellipse cx="${mx + 34}" cy="${my + 28}" rx="8" ry="4.2" fill="#4caf50" transform="rotate(-20 ${mx + 34} ${my + 28})"/>
      <rect x="${mx + 46}" y="${my + 17}" width="16" height="1.8" rx=".9" fill="#9aa3ad"/>
      <rect x="${mx + 46}" y="${my + 23}" width="13" height="1.8" rx=".9" fill="#9aa3ad"/>
      <rect x="${mx + 46}" y="${my + 29}" width="15" height="1.8" rx=".9" fill="#9aa3ad"/>
      <text x="${mx + 33}" y="${my + 38}" text-anchor="middle" font-size="4.6" fill="#6b7480" ${F}>빛 + 물 + 이산화 탄소</text>`;
  }
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="#2a2f37"/>${screen}
    <rect x="${cx - 6}" y="110" width="12" height="8" fill="#2a2f37"/>`;
}

const two = n => String(n).padStart(2, '0');
const nowStr = () => { const d = new Date(); return `${two(d.getHours())}:${two(d.getMinutes())}:${two(d.getSeconds())}`; };
function log(msg, kind){
  const li = document.createElement('li'); if (kind) li.className = kind;
  li.innerHTML = `<time>${nowStr()}</time><span></span>`; li.querySelector('span').textContent = msg;
  $('log').prepend(li);
}
function feedIdle(html){ $('camView').innerHTML = `<div class="cam-idle">${html}</div>`; }
function feedShow(p, s, tag){ $('camView').innerHTML = `<div class="cam-face">${faceSVG(p)}</div><div class="bracket" data-s="${s}"></div><div class="cam-tag" data-s="${s}">${tag}</div>`; }
function feedState(s, tag){ const b = $('camView').querySelector('.bracket'), t = $('camView').querySelector('.cam-tag'); if (b) b.dataset.s = s; if (t){ t.dataset.s = s; t.textContent = tag; } }

async function compare(sims){
  pipe('compare', 'active', `0 / ${sims.length}`);
  for (let i = 0; i < sims.length; i++){
    const c = cards[i]; c.el.classList.add('scan');
    await tween(230, t => { const v = Math.round(sims[i] * t); c.pct.textContent = v + '%'; c.bar.style.width = v + '%'; });
    await sleep(60);
    c.el.classList.remove('scan'); c.el.classList.add(sims[i] >= TH ? 'match' : 'miss');
    pipe('compare', 'active', `${i + 1} / ${sims.length}`);
  }
  pipe('compare', 'done', `${sims.length}명 대조 완료`);
}
async function discard(who){
  pipe('discard', 'active', '처리 중');
  await sleep(450);
  setD('store', 'on', '저장 안 함'); await sleep(600);
  setD('learn', 'on', '학습 안 함'); await sleep(600);
  const f = $('camView').querySelector('.cam-face'); if (f) f.classList.add('shred');
  feedState('gone', '얼굴 정보 폐기 중');
  await sleep(1000);
  setD('drop', 'on', '폐기 완료');
  feedIdle('얼굴 정보 폐기됨<br><small>남은 사진·특징값 없음</small>');
  pipe('discard', 'done', '폐기 완료');
  log(`${who} 얼굴 정보 폐기 (저장·학습 안 함)`, 'ok');
}

         monN: $('gmN'), monA: $('gmA'), monIn: $('gmIn'), where: '정문 CAM-1', armIdle: 'arm-write', chip: '관리자: 업무 일지 작성 중' };
  RT = { seat: $('t2Seat'), rig: null, arm: $('t2Arm'), excl: $('tExcl'), door: $('tDoor'),
         stand: mkActor($('tStandLayer'), standingSVG(TEACHERS[2]), 1, true), standX: 380, doorX: 565,
         monN: $('tmN'), monA: $('tmA'), monIn: $('tmIn'), where: '후문 CAM-2', armIdle: 'arm-type', chip: '선생님들: 수업 준비 중' };
}
function roomReset(r){
  r.seat.style.display = ''; r.stand.hide(); r.excl.style.display = 'none';
  r.arm.setAttribute('class', r.armIdle); if (r.rig) r.rig.removeAttribute('transform');
  r.monN.style.display = ''; r.monA.style.display = 'none'; r.monIn.textContent = r.where;
  r.door.setAttribute('fill', 'var(--r-door)');
}
function monAlert(r){ r.monN.style.display = 'none'; r.monA.style.display = ''; r.monIn.textContent = r.where; r.excl.style.display = ''; r.arm.setAttribute('class', r.armIdle + ' paused'); }
async function leaveRoom(r, speed){
  r.excl.style.display = 'none'; r.seat.style.display = 'none';
  r.door.setAttribute('fill', 'var(--r-door-open)');
  r.stand.at(r.standX, 160).show(); r.stand.face(1);
  await r.stand.walk([[r.doorX, 160]], speed);
  r.stand.hide(); r.door.setAttribute('fill', 'var(--r-door)');
}
async function enterRoom(r){
  r.door.setAttribute('fill', 'var(--r-door-open)');
  r.stand.at(r.doorX, 160).show(); r.stand.face(-1);
  await sleep(250); r.door.setAttribute('fill', 'var(--r-door)');
  const target = r.rig ? r.standX + 66 : r.standX;
  if (r.rig) r.rig.setAttribute('transform', 'translate(66,0)');
  await r.stand.walk([[target, 160]], 140);
  r.stand.hide(); r.seat.style.display = '';
}
async function typeConfirm(r){
  r.arm.setAttribute('class', 'arm-type');
  r.monIn.textContent = '> ';
  for (const ch of '외부인 확인 완료'){ await sleep(140); r.monIn.textContent += ch; }
  await sleep(500);
  r.monA.style.display = 'none'; r.monN.style.display = '';
}

/* ---------- 상태와 화면 전환 ---------- */
let entrance = 'front', running = false, totalSteps = 0;
let A, X, G, T, camF, camB;
function S(n, text){ $('stepNo').textContent = `${n} / ${totalSteps}`; $('stepText').textContent = text; }
function inChip(t){ $('inChip').textContent = t; }

function applyEntrance(){
  const f = entrance === 'front';
  $('mapFront').style.display = f ? '' : 'none'; $('mapBack').style.display = f ? 'none' : '';
  $('camFront').style.display = f ? '' : 'none'; $('camBack').style.display = f ? 'none' : '';
  $('roomGuard').style.display = f ? '' : 'none'; $('roomStaff').style.display = f ? 'none' : '';
  $('outTitle').textContent = f ? '정문 쪽' : '후문 쪽';
  $('outChip').textContent = f ? '카메라: 정문 기둥' : '카메라: 후문 기둥';
  $('inTitle').textContent = f ? '관리소 내부' : '교무실 내부';
  $('camName').textContent = f ? 'CAM-1 · 정문' : 'CAM-2 · 후문';
  $('pickFront').setAttribute('aria-checked', f); $('pickBack').setAttribute('aria-checked', !f);
}
function resetAll(){
  [A, X, G, T].forEach(a => a.hide());
  camF.reset(); camB.reset(); clearBubbles();
  roomReset(RG); roomReset(RT);
  inChip(entrance === 'front' ? RG.chip : RT.chip);
  $('inFig').classList.remove('alarm', 'spot');
  $('staffWin').classList.remove('blink'); $('staffWin').querySelector('rect').setAttribute('fill', 'var(--s-window)');
  setStatus('safe'); alertbar(null);
  feedIdle('대기 중<br><small>감지된 사람 없음</small>');
  ['detect', 'compare', 'judge', 'action', 'discard'].forEach(k => pipe(k, 'idle', '대기'));
  cards.forEach(c => { c.el.className = 'fcard'; c.pct.textContent = '—'; c.bar.style.width = '0'; });
  verdict('wait', '판정 대기', '');
  ['store', 'learn', 'drop'].forEach(k => setD(k, 'idle', '대기'));
  $('log').innerHTML = '';
}

/* ---------- 공통 단계 ---------- */
async function detect(cam, person, face, camLabel){
  cam.watch(person);
  feedShow(face, 'scan', '얼굴 감지 · 분석 중');
  pipe('detect', 'active', '얼굴 1개');
  log(`${camLabel} 얼굴 1개 감지 → 허가 목록 대조 시작`);
  await sleep(1400);
  pipe('detect', 'done', '얼굴 1개');
}
async function judgeAuth(cam, roomChip){
  verdict('ok', '허가된 사람', '학생 3 · 일치도 97%');
  pipe('judge', 'done', '허가된 사람');
  pipe('action', 'done', '조치 없음');
  feedState('ok', '학생 3 · 97% 일치'); cam.mode('ok');
  log('대조 결과: 학생 3과 일치 (97%) → 허가', 'ok');
  log('조치 없음 · 상태 유지: 안전');
  inChip(roomChip);
}
async function judgeOut(cam){
  verdict('bad', '허가 받지 않은 사람', `최고 일치도 38% · 기준 ${TH}% 미만`);
  pipe('judge', 'bad', '허가 받지 않은 사람');
  feedState('bad', '미등록 · 최고 38%'); cam.mode('bad');
  log('대조 결과: 일치하는 얼굴 없음 (최고 38%) → 미허가', 'warn');
}

/* ---------- 시나리오 ---------- */
async function frontAuth(){
  totalSteps = 6;
  S(1, '허가된 사람(학생 3)이 정문으로 들어옵니다.');
  A.at(640, 290).show(); await A.walk([[548, 290]], 55);
  S(2, '정문 카메라가 인물을 바라봅니다.');
  const w = A.walk([[430, 290], [310, 188]], 30);
  await detect(camF, A, PEOPLE[2], 'CAM-1(정문)');
  S(3, 'AI가 허가된 사람 얼굴 목록과 하나씩 대조합니다.');
  await compare(SIM_AUTH);
  S(4, '학생 3과 일치(97%) → 허가된 사람이므로 아무 조치도 하지 않습니다.');
  await judgeAuth(camF, '관리자: 업무 일지 작성 중 · 알림 없음');
  await sleep(2200);
  S(5, '방금 인식한 얼굴 정보만 폐기합니다. 허가 목록은 그대로입니다.');
  await discard('학생 3');
  camF.unwatch();
  await w;
  S(6, '학생 3이 본관으로 들어갑니다. 관리자는 신경 쓰지 않고 하던 일을 계속합니다.');

}

  S(8, '이야기를 마친 관리자가 관리소로 돌아옵니다.');
  const wx = X.walk([[430, 290], [300, 180], [170, 140], [150, 126]], 44);

  inChip('관리자: 확인 내용 입력 중');

  pipe('action', 'done', '관리자 확인 완료');
  log('관리자 확인 입력 → 상태 변경: 경고 → 안전', 'ok');
  inChip('관리자: 하던 일로 복귀');
  await sleep(700);
  RG.rig.removeAttribute('transform'); RG.arm.setAttribute('class', 'arm-write');
  await sleep(600);
  S(10, '외부인의 얼굴 정보는 저장도 학습도 하지 않고 폐기합니다.');

  S(2, '후문 카메라가 인물을 바라봅니다.');
  const w = X.walk([[326, 200]], 15.5);

const SCENARIOS = { front: { auth: frontAuth, out: frontOut }, back: { auth: backAuth, out: backOut } };

/* ---------- 버튼 (실행 중에는 잠금) ---------- */
const lockables = () => [$('btnAuth'), $('btnOut'), $('pickFront'), $('pickBack')];
function lock(on, active){
  lockables().forEach(b => { b.disabled = on; b.classList.remove('is-running'); });
  if (on && active) active.classList.add('is-running');
}
async function run(kind, btn){
  if (running) return;
  running = true; lock(true, btn);
  resetAll();
  log(`시뮬레이션 시작 · ${entrance === 'front' ? '정문' : '후문'} · ${kind === 'auth' ? '허가된 사람' : '허가 받지 않은 사람'}`);
  try { await SCENARIOS[entrance][kind](); $('stepNo').textContent = '완료'; }
  catch (e) { console.error(e); $('stepText').textContent = '실행 중 문제가 생겼습니다. 버튼을 다시 눌러 주세요.'; }
  finally { running = false; lock(false); }
}
function pick(e){
  if (running || entrance === e) return;
  entrance = e; applyEntrance(); resetAll();
  $('stepNo').textContent = '대기';
  $('stepText').textContent = `${e === 'front' ? '정문' : '후문'}을 골랐습니다. 인물 버튼을 누르면 끝까지 자동으로 실행됩니다.`;
  log(`시스템 대기 · ${e === 'front' ? 'CAM-1 정문' : 'CAM-2 후문'} 감시 중`);
}

/* ---------- 시작 ---------- */
function init(){
  buildRooms(); buildFaces(); makeRooms();
  const layer = $('actors');
  A = mkActor(layer, figSVG(FIG.auth), 1.25);
  X = mkActor(layer, figSVG(FIG.out), 1.25);
  G = mkActor(layer, figSVG(FIG.guard), 1.25);
  T = mkActor(layer, figSVG(FIG.teacher), 1.25);
  camF = new Cam($('camFrontRig'), 551, 255, 20);
  camB = new Cam($('camBackRig'), 131, 138, 160);
  applyEntrance(); resetAll();
  log('시스템 대기 · CAM-1 정문 감시 중');
  $('btnAuth').addEventListener('click', e => run('auth', e.currentTarget));
  $('btnOut').addEventListener('click', e => run('out', e.currentTarget));
  $('pickFront').addEventListener('click', () => pick('front'));
  $('pickBack').addEventListener('click', () => pick('back'));
  const tick = () => { $('clock').textContent = `시각 인공지능 얼굴 대조 · ${nowStr()}`; };
  tick(); setInterval(tick, 1000);
  let last = performance.now();
  const loop = now => {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    for (const a of actors){ if (a.walking) a.phase += dt * SPEED * 11; if (a.visible) a.render(); }
    camF.update(); camB.update();
    for (const b of bubbles) b.update();
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
init();
})();
